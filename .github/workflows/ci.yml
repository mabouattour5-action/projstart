# ---------------------------------------------------------------------------
# Continuous Integration
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

  # Lets ANOTHER workflow run this one as a job. The release pipeline
  # calls it so a tag can never be published without passing CI first.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}

  # Cancel superseded runs on PULL REQUESTS only.
  #
  # On a feature branch, a run for an old commit is worthless once you push
  # again. On main it is the opposite: a cancelled run leaves that commit
  # with no verified status, and once main triggers deployment, cancelling
  # mid-run means aborting a half-finished deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Runs ONCE, not once per job. Validating a single file five times in
  # parallel produces the same answer five times.
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project

      # Catches composer.json edited without refreshing composer.lock.
      - run: composer validate --strict

      # Checks the LOCKED versions against known CVEs. A vulnerable
      # dependency is a production bug you did not write.
      - run: composer audit --locked

  # -------------------------------------------------------------------------
  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project
      - run: composer cs

  # -------------------------------------------------------------------------
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project
      - run: composer stan

  # -------------------------------------------------------------------------
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project
        with:
          php-version: ${{ matrix.php }}
      - run: composer test

  # -------------------------------------------------------------------------
  # Coverage runs on ONE version only. Instrumentation makes the suite
  # several times slower, and coverage does not differ between runtimes.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project
        with:
          coverage: pcov          # pcov is much faster than Xdebug for this

      # Fails below 90%. A coverage number nobody enforces only ever falls.
      - run: composer coverage

      # `if: always()` so the report is still uploaded when the threshold
      # fails - that is exactly when you want to look at it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-clover
          path: build/logs/clover.xml
          retention-days: 7

  # -------------------------------------------------------------------------
  # Builds the release artifact on every pull request and throws it away.
  #
  # Added after v1.0.0 failed at tag time: the build script was only ever
  # exercised during a release, so a broken one could not be discovered
  # until the release itself. Anything that only runs at release time is
  # untested code on your most important day.
  build-artifact:
    name: Build artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project

      - name: Build a throwaway artifact
        run: bash tools/build-release.sh "ci-${{ github.run_id }}"

      - name: Assert the archive ships the app and not the tests
        run: |
          ARCHIVE="build/dist/projstart-ci-${{ github.run_id }}.zip"
          test -f "$ARCHIVE"
          unzip -l "$ARCHIVE" | grep -q "src/PriceCalculator.php"
          unzip -l "$ARCHIVE" | grep -q "vendor/autoload.php"
          unzip -l "$ARCHIVE" | grep -q "BUILD-INFO.txt"
          ! unzip -l "$ARCHIVE" | grep -q "tests/"
          ! unzip -l "$ARCHIVE" | grep -q "phpunit"
          echo "Archive contents verified."

  # -------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [dependencies, coding-standards, static-analysis, tests, coverage, build-artifact]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more checks failed:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: All checks passed
        run: echo "Dependencies, standards, analysis, tests and coverage are green."
