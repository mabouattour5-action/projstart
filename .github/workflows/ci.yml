# ---------------------------------------------------------------------------
# Continuous Integration
#
# The repeated setup sequence now lives in a composite action at
# .github/actions/setup-php-project. Each job below states only what
# makes it different.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project
      - run: composer cs

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project
      - run: composer stan

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php-project
        with:
          php-version: ${{ matrix.php }}
      - run: composer test

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [coding-standards, static-analysis, tests]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more checks failed:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: All checks passed
        run: echo "Coding standards, static analysis and tests are green."
